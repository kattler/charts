name: Lint Charts

on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '.github/workflows/lint.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install helm-docs and kubeconform
        env:
          HELM_DOCS_VERSION: "1.14.2"
          KUBECONFORM_VERSION: "0.8.0"
        run: |
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar xz -C /usr/local/bin helm-docs
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      - name: Lint and validate
        run: |
          for chart in charts/*/; do
            helm lint "${chart}"
            helm template ci "${chart}" | kubeconform -strict -summary -ignore-missing-schemas
            for values in "${chart}"ci/*-values.yaml; do
              [ -f "${values}" ] || continue
              helm template ci "${chart}" -f "${values}" | kubeconform -strict -summary -ignore-missing-schemas
            done
          done

      - name: Check helm-docs
        run: |
          helm-docs --chart-search-root charts --template-files README.md.gotmpl --sort-values-order file
          if ! git diff --exit-code -- 'charts/*/README.md'; then
            echo "::error::Chart README.md is out of date. Run helm-docs locally and commit the result."
            exit 1
          fi
