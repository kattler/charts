name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/*/Chart.yaml'
  workflow_dispatch:
    inputs:
      chart:
        description: 'Chart to release (empty for all)'
        required: false
        type: string
      force:
        description: 'Overwrite a version that is already published'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: release-charts
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REGISTRY_PATH: ghcr.io/rocattle/charts

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GH_TOKEN}" | helm registry login "${REGISTRY}" --username "${ACTOR}" --password-stdin

      - name: Package and push charts
        env:
          INPUT_CHART: ${{ inputs.chart }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          for dir in charts/*/; do
            name="$(basename "${dir}")"
            if [ -n "${INPUT_CHART}" ] && [ "${INPUT_CHART}" != "${name}" ]; then
              continue
            fi
            version="$(yq '.version' "${dir}Chart.yaml")"
            app_version="$(yq '.appVersion' "${dir}Chart.yaml")"
            ref="oci://${REGISTRY_PATH}/${name}"

            if [ "${FORCE}" != "true" ] && helm show chart "${ref}" --version "${version}" >/dev/null 2>&1; then
              echo "${name} ${version} is already published, skipping"
              continue
            fi

            helm lint "${dir}"
            helm package "${dir}"
            helm push "${name}-${version}.tgz" "oci://${REGISTRY_PATH}"

            {
              echo "## ${name} ${version}"
              echo ""
              echo "- App version: \`${app_version}\`"
              echo "- OCI: \`${ref}\`"
              echo ""
              echo "\`\`\`console"
              echo "helm install ${name} ${ref} --version ${version}"
              echo "\`\`\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          done
